{% set name = "feedparser" %}
{% set version = "6.0.13" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ceba9cd98a0a4bfc17e24e8ea47e649f194fbf881d417fd5bd0af2927a03c5c9

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - setuptools
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - feedparser-sgmllib >=1.0.0,<2.0.0

test:
  imports:
    - feedparser
    - feedparser.datetimes
    - feedparser.namespaces
    - feedparser.parsers
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/feedparser/
  summary: Universal feed parser, handles RSS 0.9x, RSS 1.0, RSS 2.0, CDF, Atom 0.3, and Atom 1.0 feeds
  doc_url: https://pythonhosted.org/feedparser/
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - step21
